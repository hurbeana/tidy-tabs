name: Release

# Tag a version to publish it, for example:  git tag v1.3.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: ./vendor.sh
      - run: npx eslint .
      - run: node test/run.mjs
      - run: node test/wiring.mjs
      - run: ./build.sh
      - run: npx web-ext lint --source-dir dist/firefox --no-config-discovery

      - name: Attach the packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
